<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEganizer File Tools</title>
<style>
:root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1f; --mute:#6b6b6b; --line:#e3e3e0; --accent:#1f4e79; --ok:#1a7f37; --warn:#b26a00; --bad:#c62828; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
header { padding:18px 24px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:18px; margin:0; flex:1; }
header input#token { width:220px; flex:none; }
main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; display:grid; gap:16px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
@media (max-width:820px) { main { grid-template-columns:1fr; } }
section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
section.wide { grid-column:1 / -1; }
h2 { font-size:15px; margin:0 0 12px; }
label { font-size:13px; color:var(--mute); display:block; margin:10px 0 4px; }
input, select, button { font:inherit; }
input[type=text], input[type=password], input[type=number], select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; }
button { padding:8px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
button.ghost { background:#fff; color:var(--accent); }
button:disabled { opacity:.5; cursor:default; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.drop { border:2px dashed var(--line); border-radius:10px; padding:24px; text-align:center; color:var(--mute); cursor:pointer; }
.drop.over { border-color:var(--accent); color:var(--accent); }
.preview { display:flex; justify-content:center; align-items:center; min-height:200px; background:repeating-conic-gradient(#f2f2f0 0 25%, #fff 0 50%) 0 0/20px 20px; border-radius:8px; }
.preview img { max-width:100%; max-height:360px; }
dl { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:12px 0 0; }
dt { color:var(--mute); } dd { margin:0; font-weight:600; }
.sw { display:inline-block; width:14px; height:14px; border-radius:3px; border:1px solid #0002; vertical-align:-2px; margin-right:6px; }
.threads { max-height:180px; overflow:auto; margin-top:8px; font-size:13px; }
.msg { margin-top:10px; padding:8px 10px; border-radius:6px; font-size:13px; }
.msg.ok { background:#e8f5ec; color:var(--ok); } .msg.caution { background:#fff6e0; color:var(--warn); }
.msg.warning, .msg.blocked, .msg.error { background:#fdecec; color:var(--bad); }
.hint { font-size:12px; color:var(--mute); }
input[type=range] { width:100%; }
</style>
</head>
<body>
<header>
  <h1>EEganizer File Tools <span class="hint">— service demo</span></h1>
  <input id="token" type="password" placeholder="API token" autocomplete="off">
</header>
<main>
  <section>
    <h2>1. Open a design</h2>
    <div id="drop" class="drop">Drop a design file here or click to choose<br><span class="hint">PES, DST, JEF, EXP, VP3, HUS, XXX and ~35 more</span></div>
    <input id="file" type="file" hidden>
    <div id="openMsg"></div>
  </section>

  <section>
    <h2>Preview</h2>
    <div class="preview"><img id="thumb" alt=""></div>
  </section>

  <section>
    <h2>2. Properties</h2>
    <dl id="props"><dt>—</dt><dd>Open a design first</dd></dl>
    <div id="threads" class="threads"></div>
    <div class="row"><button id="sheet" class="ghost" disabled>Print thread chart</button></div>
  </section>

  <section>
    <h2>3. My machine</h2>
    <label for="brand">Machine brand</label>
    <select id="brand"></select>
    <div class="row"><button id="fit" disabled>Check fit</button><button id="download" class="ghost" disabled>Download for my machine</button></div>
    <div id="fitMsg"></div>
  </section>

  <section>
    <h2>4. Resize, rotate, mirror</h2>
    <label for="scale">Size: <b id="scaleOut">100%</b></label>
    <input id="scale" type="range" min="70" max="130" value="100">
    <div class="row">
      <label style="margin:0">Rotate <select id="rotate" style="width:auto"><option>0</option><option>90</option><option>180</option><option>270</option></select></label>
      <label style="margin:0"><input id="mirror" type="checkbox"> Mirror</label>
      <label style="margin:0"><input id="lace" type="checkbox"> Free-standing lace</label>
    </div>
    <div class="row"><button id="transform" disabled>Preview change</button><button id="transformDl" class="ghost" disabled>Download</button></div>
    <div id="transformMsg"></div>
  </section>

  <section>
    <h2>5. Add a name</h2>
    <label for="font">Alphabet files (one file per letter, one size and format)</label>
    <input id="font" type="file" multiple>
    <label for="text">Text</label>
    <input id="text" type="text" value="Benjamin">
    <div class="row">
      <label style="margin:0">Color <input id="color" type="color" value="#1f4e79"></label>
      <label style="margin:0">Gap below design (mm) <input id="gap" type="number" value="8" style="width:70px"></label>
    </div>
    <div class="row"><button id="compose" disabled>Combine</button><button id="composeDl" class="ghost" disabled>Download</button></div>
    <div id="composeMsg"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { file: null, info: null, machines: null, transformed: null, composed: null, composedName: "" };

try { $("token").value = sessionStorage.getItem("eefileToken") || ""; } catch (e) {}
$("token").addEventListener("change", () => { try { sessionStorage.setItem("eefileToken", $("token").value); } catch (e) {} });

function headers() { return { Authorization: "Bearer " + $("token").value }; }
function msg(el, level, text) { el.innerHTML = ""; if (!text) return; const d = document.createElement("div"); d.className = "msg " + level; d.textContent = text; el.appendChild(d); }
async function api(path, form, method = "POST") {
  const r = await fetch(path, { method, headers: headers(), body: form });
  if (!r.ok) {
    let body = {}; try { body = await r.json(); } catch (e) {}
    const err = new Error(body.message || (body.report && body.report.messages.join(" ")) || r.statusText);
    err.body = body; err.status = r.status; throw err;
  }
  return r;
}
function form(extra = {}) { const f = new FormData(); f.append("file", state.file); for (const [k, v] of Object.entries(extra)) f.append(k, v); return f; }
function save(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
function filenameFrom(r, fallback) { const m = /filename="([^"]+)"/.exec(r.headers.get("content-disposition") || ""); return m ? m[1] : fallback; }
async function showThumb(blobOrFile, name) {
  const f = new FormData(); f.append("file", blobOrFile, name);
  const r = await api("/v1/thumbnail?size=480", f);
  $("thumb").src = URL.createObjectURL(await r.blob());
}

async function loadMachines() {
  try {
    const r = await api("/v1/formats", null, "GET");
    const body = await r.json();
    $("brand").innerHTML = "";
    for (const brand of Object.keys(body.machines)) { const o = document.createElement("option"); o.value = brand; o.textContent = brand.replace(/_/g, " "); $("brand").appendChild(o); }
  } catch (e) { msg($("openMsg"), "error", "Enter the API token above, then reload. (" + e.message + ")"); }
}

async function open(file) {
  state.file = file; state.transformed = state.composed = null;
  ["sheet", "fit", "download", "transform", "compose"].forEach((id) => $(id).disabled = true);
  msg($("openMsg"), "ok", "Reading " + file.name + "…");
  try {
    const body = await (await api("/v1/inspect", form())).json();
    state.info = body.info;
    const i = body.info;
    $("props").innerHTML = "";
    const rows = [
      ["Format", body.format.toUpperCase()],
      ["Size", `${i.width_mm} × ${i.height_mm} mm (${i.width_in} × ${i.height_in} in)`],
      ["Stitches", i.stitch_count.toLocaleString()],
      ["Color stops", `${i.color_change_count + 1}` + (i.unique_color_count ? ` (${i.unique_color_count} colors)` : "")],
      ["Sewing time", `about ${Math.round(i.estimated_sew_minutes)} min`],
      ["Smallest hoop", body.smallest_hoop || "larger than 9.5×14"],
    ];
    for (const [k, v] of rows) { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; $("props").append(dt, dd); }
    $("threads").innerHTML = "";
    for (const t of i.threads) {
      const div = document.createElement("div"); const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = t.hex_color;
      div.append(sw, document.createTextNode(`${t.index + 1}. ${[t.brand, t.catalog_number, t.description].filter(Boolean).join(" ") || t.hex_color} — ${t.stitch_count.toLocaleString()} st`));
      $("threads").appendChild(div);
    }
    if (!i.threads.length) $("threads").textContent = "This format stores no thread colors.";
    await showThumb(file, file.name);
    msg($("openMsg"), "ok", "Opened " + file.name);
    ["sheet", "fit", "download", "transform", "compose"].forEach((id) => $(id).disabled = false);
  } catch (e) { msg($("openMsg"), "error", e.message); }
}

$("drop").onclick = () => $("file").click();
$("file").onchange = () => $("file").files[0] && open($("file").files[0]);
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); if (e.dataTransfer.files[0]) open(e.dataTransfer.files[0]); };

$("sheet").onclick = async () => {
  try { const r = await api("/v1/worksheet", form()); window.open(URL.createObjectURL(await r.blob()), "_blank"); }
  catch (e) { msg($("openMsg"), "error", e.message); }
};

$("fit").onclick = async () => {
  try {
    const machines = JSON.stringify([{ name: "My machine", brand: $("brand").value }]);
    const body = await (await api("/v1/fit-machines", form({ machines }))).json();
    const m = body.machines[0];
    const text = m.fits ? `Fits the ${m.hoop.label} hoop${m.needs_rotation ? " (rotate 90°)" : ""}. Exports as .${m.export_format}.` : m.messages.join(" ");
    msg($("fitMsg"), m.fits ? (m.messages.length ? "caution" : "ok") : "warning", text + (m.fits && m.messages.length ? " " + m.messages.join(" ") : ""));
  } catch (e) { msg($("fitMsg"), "error", e.message); }
};

$("download").onclick = async () => {
  try {
    const r = await api("/v1/convert?machine=" + encodeURIComponent($("brand").value), form());
    const warnings = JSON.parse(r.headers.get("x-eefile-warnings") || "[]");
    save(await r.blob(), filenameFrom(r, "design"));
    msg($("fitMsg"), warnings.length ? "caution" : "ok", warnings.length ? warnings.join(" ") : "Downloaded. Copy it to your USB stick.");
  } catch (e) { msg($("fitMsg"), "error", e.message); }
};

$("scale").oninput = () => $("scaleOut").textContent = $("scale").value + "%";
$("transform").onclick = async () => {
  $("transformDl").disabled = true;
  const q = new URLSearchParams({ scale: $("scale").value / 100, rotate: $("rotate").value, mirror_horizontal: $("mirror").checked, free_standing_lace: $("lace").checked });
  try {
    const r = await api("/v1/transform?" + q, form());
    const report = JSON.parse(r.headers.get("x-eefile-transform-report"));
    state.transformed = { blob: await r.blob(), name: filenameFrom(r, state.file.name) };
    await showThumb(state.transformed.blob, state.transformed.name);
    msg($("transformMsg"), report.level, report.messages.join(" ") || "Looks safe. Density changes to " + report.density_factor + "× of the original.");
    $("transformDl").disabled = false;
  } catch (e) { msg($("transformMsg"), "blocked", e.message); }
};
$("transformDl").onclick = () => state.transformed && save(state.transformed.blob, state.transformed.name);

$("compose").onclick = async () => {
  $("composeDl").disabled = true;
  const letters = [...$("font").files];
  if (!letters.length) return msg($("composeMsg"), "error", "Choose the alphabet's letter files first.");
  const f = new FormData();
  f.append("files", state.file);
  for (const l of letters) f.append("files", l);
  const layout = {
    name: state.file.name.replace(/\.[^.]+$/, "") + " with name",
    items: [
      { type: "design", file: state.file.name, x_mm: 0, y_mm: 0 },
      { type: "text", text: $("text").value, alphabet: "font", below: true, gap_mm: Number($("gap").value), thread: $("color").value },
    ],
    alphabets: { font: letters.map((l) => l.name) },
    machine: $("brand").value,
  };
  f.append("layout", JSON.stringify(layout));
  try {
    const r = await api("/v1/compose", f);
    const report = JSON.parse(r.headers.get("x-eefile-compose-report"));
    state.composed = { blob: await r.blob(), name: filenameFrom(r, "combined") };
    await showThumb(state.composed.blob, state.composed.name);
    const parts = [`${report.width_mm} × ${report.height_mm} mm, ${report.color_change_count + 1} color stops.`].concat(report.messages);
    msg($("composeMsg"), report.level, parts.join(" "));
    $("composeDl").disabled = false;
  } catch (e) { msg($("composeMsg"), "error", e.message); }
};
$("composeDl").onclick = () => state.composed && save(state.composed.blob, state.composed.name);

loadMachines();
</script>
</body>
</html>
