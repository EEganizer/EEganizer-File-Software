[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeganizer-files"
version = "0.1.0"
description = "EEganizer embroidery design file toolkit: inspect, preview, convert, resize, hoop-fit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pystitch>=1.0.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
eefile = "eeganizer_files.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
