[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeganizer-files"
version = "0.2.0"
description = "EEganizer embroidery design file toolkit: inspect, preview, convert, resize, hoop-fit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pystitch>=1.0.1,<2"]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
eefile = "eeganizer_files.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eeganizer_files = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
